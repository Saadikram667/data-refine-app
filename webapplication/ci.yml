name: tests
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: for f in script.js image-core.js image-ui.js logos.js; do node --check "$f"; done
      - run: npm test
